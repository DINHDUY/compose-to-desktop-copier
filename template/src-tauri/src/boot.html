<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b2b2f;
        color: #f2f2f2;
        font: 14px/1.4 "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        width: 440px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
      }
      #phase {
        margin: 0 0 4px;
        font-weight: 600;
      }
      #detail {
        margin: 0 0 14px;
        color: #c8c8cc;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .progress-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .progress-track {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: #3d3d42;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 4px;
        background: #4c8bf5;
        transition: width 0.4s ease;
      }
      .progress-fill.stalled {
        background: linear-gradient(
          90deg,
          #4c8bf5 0%,
          #6aa3ff 50%,
          #4c8bf5 100%
        );
        background-size: 200% 100%;
        animation: stripe 1.2s linear infinite;
      }
      @keyframes stripe {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: 0 0;
        }
      }
      #percent {
        min-width: 36px;
        text-align: right;
        color: #c8c8cc;
        font-variant-numeric: tabular-nums;
      }
      #footer {
        margin: 0;
        color: #9a9aa0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Starting</h1>
      <p id="phase">Preparing the stack</p>
      <p id="detail">Loading configuration</p>
      <div class="progress-row">
        <div class="progress-track">
          <div id="fill" class="progress-fill"></div>
        </div>
        <span id="percent">0%</span>
      </div>
      <p id="footer">Estimated progress · 0:00 elapsed</p>
    </main>
    <script>
      var lastPercent = 0;
      var lastChange = Date.now();

      window.setProductName = function (text) {
        document.getElementById("title").textContent = text;
      };

      window.updateBoot = function (update) {
        if (update.title) {
          document.getElementById("phase").textContent = update.title;
        }
        if (update.detail) {
          document.getElementById("detail").textContent = update.detail;
        }
        if (typeof update.percent === "number") {
          var fill = document.getElementById("fill");
          var percent = Math.max(0, Math.min(100, update.percent));
          fill.style.width = percent + "%";
          document.getElementById("percent").textContent = percent + "%";
          if (percent !== lastPercent) {
            lastPercent = percent;
            lastChange = Date.now();
          }
          if (Date.now() - lastChange > 2000) {
            fill.classList.add("stalled");
          } else {
            fill.classList.remove("stalled");
          }
        }
        if (typeof update.elapsedSecs === "number") {
          var mins = Math.floor(update.elapsedSecs / 60);
          var secs = update.elapsedSecs % 60;
          var elapsed =
            mins + ":" + (secs < 10 ? "0" : "") + secs;
          document.getElementById("footer").textContent =
            "Estimated progress · " + elapsed + " elapsed";
        }
      };
    </script>
  </body>
</html>
